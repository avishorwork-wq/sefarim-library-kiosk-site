<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netiv Aryeh idle test</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070711;font-family:Arial,sans-serif;color:#eefaff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;opacity:0;transition:opacity .65s cubic-bezier(.2,.7,.2,1)}
#idle-screen{position:fixed;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:32px;background:radial-gradient(ellipse at 50% 43%,#10283a 0,#0b1423 32%,#070711 70%);border:0;width:100%;cursor:pointer;color:#caeaff;opacity:0;transition:opacity .65s ease;overflow:hidden}
#idle-screen::before{content:"";position:absolute;width:min(600px,82vw);height:min(600px,82vw);border:1px solid #7acdf514;border-radius:50%;box-shadow:0 0 100px #7acdf508,inset 0 0 100px #7acdf505;animation:halo 7s ease-in-out infinite}
#idle-screen img{position:relative;width:260px;max-width:60vw;height:auto;object-fit:contain;filter:drop-shadow(0 8px 25px #0007)}
#start-hint{position:relative;font-size:14px;letter-spacing:.06em;color:#96bbcf;animation:breathe 3.5s ease-in-out infinite}#idle-screen.logo-only #start-hint{display:none}
#idle-screen:focus-visible{outline:3px solid #7acdf5;outline-offset:-12px}
#warning{border:1px solid #9bc9e13d;border-radius:26px;background:linear-gradient(155deg,#152536,#0b1523);color:#e8f7ff;padding:32px;width:min(470px,90vw);text-align:center;box-shadow:0 28px 100px #0008;overflow:hidden}
#warning::backdrop{background:#050a13a8;backdrop-filter:blur(12px);animation:veil .5s ease both}#warning h2{margin:10px 0 8px;font-size:26px;font-weight:600}#warning p{font-size:15px;line-height:1.65;color:#a9c6d8;margin:8px 0 18px}
.warn-overline{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#78cafa}
.count-ring{position:relative;width:112px;height:112px;margin:26px auto}.count-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}.count-ring circle{fill:none;stroke-width:3}.ring-track{stroke:#294153}.ring-progress{stroke:#7bd1ff;stroke-dasharray:314;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear;stroke-linecap:round}#seconds{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;line-height:1;font-weight:500;color:#e8f8ff;font-variant-numeric:tabular-nums}
#continue{border:1px solid #c7efff66;border-radius:13px;background:#8ed8ff;color:#0b263b;font-size:17px;font-weight:600;min-height:52px;padding:12px 24px;width:100%;cursor:pointer;box-shadow:0 8px 24px #0003;transition:background .2s,transform .2s}#continue:hover{background:#b7e8ff}#continue:active{transform:scale(.985)}.test-label{position:fixed;z-index:4;top:10px;left:10px;background:#0c1b2cd9;color:#8caec2;border:1px solid #7acdf526;border-radius:8px;padding:6px 10px;font-size:10px;letter-spacing:.04em;pointer-events:none}
[hidden]{display:none!important}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@keyframes halo{0%,100%{transform:scale(.98);opacity:.5}50%{transform:scale(1.02);opacity:1}}@keyframes veil{from{background:#050a1300;backdrop-filter:blur(0)}to{background:#050a13a8;backdrop-filter:blur(12px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* A light, independent idle scene. Only opacity and transforms animate. */
html,body{background:#f5fafb;color:#19364b}
#idle-screen{background:radial-gradient(ellipse at 50% 42%,#fff 0%,#f1f9fc 44%,#e6f1f6 100%);color:#2c5269;isolation:isolate}
#idle-screen::before{width:min(74vw,690px);height:min(74vw,690px);border:1px solid #fff9;background:radial-gradient(circle,#ffffffa8 0%,#e7f8ff55 52%,transparent 72%);box-shadow:0 0 120px #b9e9fb60,inset 0 0 80px #fff8;animation:light-halo 12s ease-in-out infinite}
#idle-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 14% 25%,#d1f2ff7a,transparent 38%),radial-gradient(ellipse at 86% 78%,#ffefc980,transparent 37%);opacity:.7}
.light-field{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.light-orb{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fffaf0c0 14%,#d8f3fd55 43%,transparent 72%);filter:blur(2px);will-change:transform;animation:light-drift 17s ease-in-out infinite alternate}
.light-orb:nth-child(1){width:44vw;height:44vw;left:-8%;top:6%;--dx:12vw;--dy:7vh}
.light-orb:nth-child(2){width:36vw;height:36vw;right:-3%;top:18%;--dx:-9vw;--dy:14vh;animation-duration:23s;animation-delay:-8s;background:radial-gradient(circle,#fffef4 0%,#fff0c7b0 20%,#fff0c730 49%,transparent 72%)}
.light-orb:nth-child(3){width:49vw;height:49vw;left:8%;bottom:-12%;--dx:19vw;--dy:-11vh;animation-duration:21s;animation-delay:-12s}
.light-orb:nth-child(4){width:28vw;height:28vw;right:9%;bottom:18%;--dx:-14vw;--dy:-9vh;animation-duration:19s;animation-delay:-5s}
#idle-screen img{z-index:1;width:300px;max-width:57vw;filter:brightness(.52) saturate(1.35) contrast(1.15) drop-shadow(0 8px 22px #80b6ce25);animation:logo-light 9s ease-in-out infinite}
#idle-screen:focus-visible{outline:3px solid #39799b;outline-offset:-12px}
#warning{background:linear-gradient(155deg,#fff,#f0f8fc);color:#19364b;border-color:#bed6e1;box-shadow:0 28px 100px #19364b26}
#warning p{color:#4d697b}#warning::backdrop{background:#e4f1f5ad;backdrop-filter:blur(12px);animation:none}.warn-overline{color:#467d97}.ring-track{stroke:#d4e6ee}.ring-progress{stroke:#5da4c4}#seconds{color:#254d65}
#continue{background:#d1edfa;color:#153d55;border-color:#a5cfe2;box-shadow:0 8px 24px #9ac5d633}#continue:hover{background:#bee5f7}
@keyframes light-drift{from{transform:translate3d(0,0,0) scale(.88);opacity:.58}to{transform:translate3d(var(--dx),var(--dy),0) scale(1.12);opacity:1}}
@keyframes light-halo{0%,100%{transform:scale(.96);opacity:.62}50%{transform:scale(1.04);opacity:1}}
@keyframes logo-light{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.light-orb{opacity:.7;will-change:auto}}

/* Quiet editorial lockup, without a badge or a giant circle. */
#idle-screen{background:linear-gradient(145deg,#f8fcfe,#eaf5f9 62%,#f5f8f3)}
#idle-screen::before{display:none}
#idle-screen::after{opacity:.45}
#idle-screen img{width:240px;max-width:48vw;filter:brightness(.40) saturate(.85) contrast(1.2);animation:none;will-change:opacity,transform}
.idle-lockup{display:flex;flex-direction:column;align-items:center;gap:26px;position:relative;z-index:1}
.idle-caption{font:500 12px/1.7 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#527486}
.idle-rule{height:1px;width:46px;background:#87b8cd80}
.light-orb{filter:blur(12px)}
.light-orb:nth-child(1){width:65vw;height:65vw;left:-28%;top:-10%;opacity:.6}
.light-orb:nth-child(2){width:54vw;height:54vw;right:-25%;top:10%}
.light-orb:nth-child(3){width:59vw;height:59vw;left:-12%;bottom:-28%}
.light-orb:nth-child(4){width:44vw;height:44vw;right:-19%;bottom:2%}
iframe{transition:opacity 1s cubic-bezier(.22,.61,.36,1)}
#idle-screen{transition:opacity .85s cubic-bezier(.22,.61,.36,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#idle-screen img{will-change:auto}}

function start(){if(state==='starting')return;state='starting';last=Date.now();deadline=0;frame=document.createElement('iframe');frame.title='Library kiosk / קיוסק הספרייה';frame.src='./1-idle-kiosk.html';frame.style.opacity='0';frame.onload=()=>{try{wire(frame.contentDocument)}catch{}requestAnimationFrame(()=>{screen.style.opacity='0';setTimeout(()=>screen.hidden=true,reduced()?0:850);document.querySelector('.test-label').hidden=false;frame.style.opacity='1';state='active';last=Date.now()})};document.body.append(frame)}
async function sleep(){state='transition';document.querySelector('.test-label').hidden=true;if(frame){frame.style.opacity='0';frame.style.visibility='hidden'}await motion(warn,[{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(8px) scale(.97)'}],350);warn.close();deadline=0;screen.hidden=false;screen.style.opacity='0';document.querySelector('.test-label').hidden=true;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));screen.style.opacity='1';if(!reduced()){screen.querySelector('img').animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:1250,delay:220,easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'});screen.querySelector('.idle-caption').animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:1100,delay:520,easing:'ease-out',fill:'both'});screen.querySelector('.idle-rule').animate([{opacity:0,transform:'scaleX(.4)'},{opacity:1,transform:'scaleX(1)'}],{duration:1000,delay:420,easing:'ease-out',fill:'both'});}if(frame)frame.style.opacity='0';await new Promise(r=>setTimeout(r,reduced()?0:700));frame?.remove();frame=null;state='idle';screen.focus({preventScroll:true})}
function resume(){warn.close();state='active';deadline=0;last=Date.now();frame?.contentWindow.focus()}
function tick(){const now=Date.now();if(state==='active'&&now-last>=IDLE_MS){state='warning';deadline=now+WARNING_MS;count.textContent='15';document.querySelector('.ring-progress').style.strokeDashoffset=0;warn.showModal();motion(warn,[{opacity:0,transform:'translateY(18px) scale(.96)'},{opacity:1,transform:'translateY(0) scale(1)'}],500);document.getElementById('continue').focus()}else if(state==='warning'){count.textContent=Math.max(0,Math.ceil((deadline-now)/1000));document.querySelector('.ring-progress').style.strokeDashoffset=314*(1-Math.max(0,(deadline-now)/WARNING_MS));if(now>=deadline)sleep()}}
warn.addEventListener('cancel',e=>{e.preventDefault();resume()});document.getElementById('continue').onclick=resume;screen.onclick=start;wire(document);setInterval(tick,200);start();
// No timers or idle code are installed in the main kiosk. This wrapper owns them.
})();
