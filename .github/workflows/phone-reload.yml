name: Reload all running kiosks now
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owner-forced-kiosk-reload
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish a short-lived reload command only
        uses: actions/github-script@v7
        with:
          script: |
            const path = '50-reload-signal.json';
            const issued = new Date();
            const command = {
              schema: 1,
              kind: 'force-reload',
              id: `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`,
              issuedAt: issued.toISOString(),
              expiresAt: new Date(issued.getTime() + 10 * 60 * 1000).toISOString()
            };
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'
            }).catch(e => { if (e.status === 404) return null; throw e; });
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: 'main', path,
              message: 'Owner requested immediate kiosk reload [skip ci]',
              content: Buffer.from(JSON.stringify(command, null, 2) + '\n').toString('base64'),
              ...(current ? {sha: current.data.sha} : {})
            });
            core.summary.addHeading('Reload command published').addRaw(
              'Online kiosks running the new code check about every 30 seconds. GitHub queue, caching, sleeping or offline devices can delay or prevent delivery. This run is not a kiosk acknowledgement.'
            ).write();
