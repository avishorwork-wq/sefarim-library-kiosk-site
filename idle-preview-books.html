<title>Idle Preview - Books (code recreation)</title>
<style>
@font-face{font-family:Rubik;src:url('./font-rubik-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Rubik;src:url('./font-rubik-hebrew.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+0590-05FF,U+FB1D-FB4F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#c6ddfc}
body{font-family:Rubik,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%}
.drift-slow{animation:drift 46s linear infinite}
.drift-mid{animation:drift 34s linear infinite}
.drift-fast{animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1586px)}}
#sheen{position:fixed;inset:-10%;pointer-events:none;background:radial-gradient(60% 45% at 25% 20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(55% 40% at 80% 75%,rgba(255,255,255,.22),transparent 65%);mix-blend-mode:soft-light;animation:sheen 26s ease-in-out infinite alternate}
@keyframes sheen{from{transform:translate(-1.2%,-0.8%)}to{transform:translate(1.2%,1%)}}
#ui{position:fixed;inset:0;display:block}
#el-logo{position:absolute;left:50%;top:17.8%;transform:translate(-50%,-50%);height:8.6vh;filter:brightness(.40) saturate(.85) contrast(1.2)}
#el-clock{position:absolute;left:50%;top:39.2%;transform:translate(-50%,-50%);font:700 19.5vw Rubik,Arial,sans-serif;color:#091e42;letter-spacing:.005em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
@media (min-aspect-ratio:1/1){#el-clock{font-size:24.6vh}}
#el-date{position:absolute;left:50%;top:52.9%;transform:translate(-50%,-50%);font:600 2.35vh Rubik,Arial,sans-serif;color:#1a3159;letter-spacing:.14em;white-space:nowrap}
#el-date .he{letter-spacing:.04em}
#el-date .sep{opacity:.55;margin:0 .9em;font-weight:400}
#el-tap{position:absolute;left:50%;top:67.7%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:1.1vh;font:600 2.5vh Rubik,Arial,sans-serif;color:#2f3b75;letter-spacing:.13em;white-space:nowrap;animation:breathe 3.2s ease-in-out infinite}
#el-tap .sep{opacity:.55;margin:0 .7em;font-weight:400}
#el-tap svg{width:3.4vh;height:3.4vh;stroke:#2f3b75;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@keyframes breathe{0%,100%{opacity:.92}50%{opacity:.55}}
#tag{position:fixed;left:10px;top:10px;background:rgba(9,30,66,.75);color:#fff;font:600 11px Rubik,Arial;padding:4px 9px;border-radius:6px;letter-spacing:.06em;z-index:5}
</style>

<div id="tag">PREVIEW - not on the kiosk</div>
<script>
(function(){
var offset=null,lastSync=0;
var clock=document.getElementById('el-clock');
var dEn=document.querySelector('#el-date .en');
var dHe=document.querySelector('#el-date .he');
var DAYS=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
var MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
var HDAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var HMONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function now(){return new Date(Date.now()+((offset===null)?0:offset));}
function pad(n){return (n<10?'0':'')+n;}
function jNow(){var t=now();return new Date(t.toLocaleString('en-US',{timeZone:'Asia/Jerusalem'}));}
var lastMinute=-1;
function render(){
var j=jNow();
var hh=pad(j.getHours()),mm=pad(j.getMinutes());
clock.textContent=hh+':'+mm;
if(j.getMinutes()!==lastMinute){lastMinute=j.getMinutes();
dEn.textContent=DAYS[j.getDay()]+' '+j.getDate()+' '+MONTHS[j.getMonth()];
dHe.textContent='יום '+HDAYS[j.getDay()]+', '+j.getDate()+' ב'+HMONTHS[j.getMonth()];
}
}
function armMinute(){
var j=jNow();
var ms=(60-j.getSeconds())*1000-j.getMilliseconds()+150;
setTimeout(function(){render();armMinute();},ms);
}
function tickFast(){render();}
function sync(){
var t0=Date.now();
fetch('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Jerusalem',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
var rtt=(Date.now()-t0)/2;
var off=(j.dstActive?'+03:00':'+02:00');
var remote=new Date(j.dateTime+off).getTime()+rtt;
var o=remote-Date.now();
if(Math.abs(o)<15*60*1000){offset=o;lastSync=Date.now();render();}
}).catch(function(){});
}
render();armMinute();setInterval(tickFast,1000);
sync();setInterval(sync,10*60*1000);
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync();});
})();
</script>
